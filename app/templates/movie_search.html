{% extends 'base.html' %}

{% block page_content %}
<h1>Search Movies</h1>
<form method="POST">
    <input type="text" name="movie" placeholder="Enter movie name..." required>
    <button type="submit">Search</button>
</form>
{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

{% endblock %}
