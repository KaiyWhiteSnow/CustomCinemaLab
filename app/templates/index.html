
{% extends 'base.html' %}
{% block page_content %}

<form method="POST" action="/" class="d-flex flex-row align-items-center justify-content-center gap-3">
    <button
        type="submit"
        name="online"
        id="online"
        value="Online"
        class="button-background w-100 h-100"
        style="--button-image: url('{{ url_for('static', filename='img/online.jpg') }}');">
        Online
    </button>

    <button
        type="submit"
        name="offline"
        id="offline"
        value="Offline"
        class="button-background w-100 h-100"
        style="--button-image: url('{{ url_for('static', filename='img/offline.jpg') }}');">
        Offline
    </button>
</form>

{% endblock %}
